MSG_CLEAR_CACHE_FAIL=清理缓存目录失败！
MSG_CLEAR_CACHE_EMPTY=缓存目录不存在或为空，无需清理。
STR_ADV_HINT_DIR_CACHE_TIME=目录信息在内存中的缓存时长，如 72h
STR_ADV_HINT_BUFFER_SIZE=每个打开文件的缓冲区大小，如 16M
STR_ADV_HINT_TRANSFERS=并行文件传输数量，如 4
