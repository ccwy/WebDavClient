# === 通用 VFS/Mount 参数（适用于所有协议） ===
STR_VFS_CACHE_MODE=缓存模式:
STR_VFS_CACHE_OFF=off
STR_VFS_CACHE_MINIMAL=minimal
STR_VFS_CACHE_WRITES=writes
STR_VFS_CACHE_FULL=full
STR_VFS_TIP_OFF=不缓存，每次读写实时走网络，延迟高，很多软件（视频编辑、数据库）没法正常工作。
STR_VFS_TIP_MINIMAL=只缓存目录信息，文件内容还是实时拉取，适合只读场景。
STR_VFS_TIP_WRITES=写入先落本地，读取视情况远程拉取，性能和磁盘占用的平衡点，很多人推荐日常用这个。
STR_VFS_TIP_FULL=读写都先走本地缓存，性能最好，适合视频播放等，但最占空间。
STR_ADV_DIR_CACHE_TIME=目录缓存时间:
STR_ADV_BUFFER_SIZE=缓冲区大小:
STR_ADV_TRANSFERS=并行传输数:
STR_ADV_CACHE_DIR=缓存目录:
STR_ADV_VFS_CACHE_MAX_AGE=缓存保留时间:
STR_ADV_VFS_READ_CHUNK=读取块大小:
STR_ADV_VFS_READ_CHUNK_LIMIT=读取块上限:
STR_ADV_VFS_CACHE_MAX_SIZE=缓存最大容量:
STR_ADV_HINT_DIR_CACHE_TIME=目录信息在内存中的缓存时长，如 24h
STR_ADV_HINT_BUFFER_SIZE=每个打开文件的缓冲区大小，如 64M
STR_ADV_HINT_TRANSFERS=并行文件传输数量，如 4
STR_ADV_HINT_CACHE_DIR=缓存文件存放目录，留空使用系统临时目录
STR_ADV_HINT_VFS_CACHE_MAX_AGE=缓存文件最长保留时间，如 24h
STR_ADV_HINT_VFS_READ_CHUNK=VFS 读取块大小，如 128M
STR_ADV_HINT_VFS_READ_CHUNK_LIMIT=VFS 读取块大小上限，off 表示不限制
STR_ADV_HINT_VFS_CACHE_MAX_SIZE=VFS 缓存目录的最大大小，超过后自动清理旧文件，如 15G
