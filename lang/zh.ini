STR_VFS_CACHE_MODE=缓存模式:
STR_VFS_CACHE_OFF=off
STR_VFS_CACHE_MINIMAL=minimal
STR_VFS_CACHE_WRITES=writes
STR_VFS_CACHE_FULL=full
STR_VFS_TIP_OFF=不缓存，每次读写实时走网络，延迟高，很多软件（视频编辑、数据库）没法正常工作。
STR_VFS_TIP_MINIMAL=只缓存目录信息，文件内容还是实时拉取，默认值，适合只读场景。
STR_VFS_TIP_WRITES=写入先落本地，读取视情况远程拉取，性能和磁盘占用的平衡点，很多人推荐日常用这个。
STR_VFS_TIP_FULL=读写都先走本地缓存，性能最好，但最占空间。