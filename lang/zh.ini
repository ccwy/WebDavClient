MSG_WIN10_ON_WIN7=此版本仅适用于 Windows 10 及以上系统，当前系统为 Windows 7 %s位，请使用 Windows 7 %s位版本。
MSG_UNSUPPORTED_OS=不支持的操作系统，本程序要求 Windows 7 及以上 %s位系统。
