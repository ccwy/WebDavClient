STR_ADV_HINT_DIR_CACHE_TIME=Extend directory metadata cache time, e.g. 72h (--dir-cache-time)
STR_ADV_HINT_BUFFER_SIZE=Set memory buffer size, recommended 1/8 of system RAM. E.g. 1G for 8G RAM, recommended range: 64M~512M. Note: Do not set too large if memory is limited. (--buffer-size)
STR_ADV_HINT_TRANSFERS=Number of parallel file transfers, e.g. 4 (--transfers)
STR_ADV_HINT_CACHE_DIR=Set a directory on local fast storage (e.g. SSD) as cache location. Avoid network drives or slow disks. Leave empty for system temp directory. (--cache-dir)
STR_ADV_HINT_VFS_CACHE_MAX_AGE=Set maximum retention time for cached files. Files not accessed for a long time will be purged. Adjust as needed, e.g. 24h (--vfs-cache-max-age)
STR_ADV_HINT_VFS_READ_CHUNK=Read chunk size, can improve read performance for large files, e.g. 168M (--vfs-read-chunk-size)
STR_ADV_HINT_VFS_READ_CHUNK_LIMIT=Read chunk maximum size, off means no limit (--vfs-read-chunk-size-limit)
STR_ADV_HINT_VOLNAME=Volume label for the mounted disk, e.g. WebDAV_Disk (--volname)
STR_ADV_VFS_CACHE_MAX_SIZE=Cache Max Size:
STR_ADV_HINT_VFS_CACHE_MAX_SIZE=Maximum size of the cache directory, old files are purged automatically when exceeded, e.g. 15G (--vfs-cache-max-size)