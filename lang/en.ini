STR_VFS_CACHE_MODE=Cache Mode:
STR_VFS_CACHE_OFF=off
STR_VFS_CACHE_MINIMAL=minimal
STR_VFS_CACHE_WRITES=writes
STR_VFS_CACHE_FULL=full
STR_VFS_TIP_OFF=No cache. All reads/writes go over the network in real-time. High latency; many apps (video editing, databases) won't work properly. (--vfs-cache-mode)
STR_VFS_TIP_MINIMAL=Only caches directory info. File content is fetched in real-time. Suitable for read-only scenarios. (--vfs-cache-mode)
STR_VFS_TIP_WRITES=Writes go to local cache first, reads fetched remotely as needed. Balance of performance and disk usage. Recommended for daily use. (--vfs-cache-mode)
STR_VFS_TIP_FULL=Both reads and writes go through local cache first. Best performance, but uses the most disk space. (--vfs-cache-mode)
