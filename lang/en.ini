# === Common VFS/Mount parameters (applies to all protocols) ===
STR_VFS_CACHE_MODE=Cache Mode:
STR_VFS_CACHE_OFF=off
STR_VFS_CACHE_MINIMAL=minimal
STR_VFS_CACHE_WRITES=writes
STR_VFS_CACHE_FULL=full
STR_VFS_TIP_OFF=No cache. All reads/writes go over the network in real-time. High latency; many apps (video editing, databases) won't work properly.
STR_VFS_TIP_MINIMAL=Only caches directory info. File content is fetched in real-time. Suitable for read-only scenarios.
STR_VFS_TIP_WRITES=Writes go to local cache first, reads fetched remotely as needed. Balance of performance and disk usage. Recommended for daily use.
STR_VFS_TIP_FULL=Both reads and writes go through local cache first. Best performance, but uses the most disk space.
STR_ADV_DIR_CACHE_TIME=Dir Cache Time:
STR_ADV_BUFFER_SIZE=Buffer Size:
STR_ADV_TRANSFERS=Transfers:
STR_ADV_CACHE_DIR=Cache Dir:
STR_ADV_VFS_CACHE_MAX_AGE=Cache Max Age:
STR_ADV_VFS_READ_CHUNK=Read Chunk Size:
STR_ADV_VFS_READ_CHUNK_LIMIT=Read Chunk Limit:
STR_ADV_VFS_CACHE_MAX_SIZE=Cache Max Size:
STR_ADV_HINT_DIR_CACHE_TIME=Time to cache directory entries, e.g. 24h
STR_ADV_HINT_BUFFER_SIZE=Buffer size per open file, e.g. 64M
STR_ADV_HINT_TRANSFERS=Number of parallel file transfers, e.g. 4
STR_ADV_HINT_CACHE_DIR=Directory for cache files, leave empty for system temp
STR_ADV_HINT_VFS_CACHE_MAX_AGE=Max age of cached files, e.g. 24h
STR_ADV_HINT_VFS_READ_CHUNK=VFS read chunk size, e.g. 128M
STR_ADV_HINT_VFS_READ_CHUNK_LIMIT=VFS read chunk size limit, off for unlimited
STR_ADV_HINT_VFS_CACHE_MAX_SIZE=Maximum size of the VFS cache directory, old files are purged when exceeded, e.g. 15G
