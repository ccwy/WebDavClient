name: Build WebDAV Client[cite: 5]

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    strategy:
      matrix:
        platform: [WIN7, WIN10]
        target:
          - { arch: "Win32", name: "x86" }
          - { arch: "x64",   name: "x64" }

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build_${{ matrix.platform }}_${{ matrix.target.name }} -S . -A ${{ matrix.target.arch }} -DTARGET_PLATFORM=${{ matrix.platform }}

    - name: Build
      run: cmake --build build_${{ matrix.platform }}_${{ matrix.target.name }} --config Release

    - name: Prepare Artifacts and Version
      shell: pwsh
      run: |
        mkdir release_package
        
        # 判断是否为 Tag 触发，如果是则使用 Tag 名（如 v1.0.0），否则用 dev
        $version = "dev"
        if ("${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref_name }}"
        }
        
        # 拼接带版本号的新文件名
        $fileName = "WebDavClient_${{ matrix.platform }}_${{ matrix.target.name }}_${version}.exe"
        
        # 将文件名存入环境变量，供后续步骤使用
        echo "FILENAME=$fileName" >> $env:GITHUB_ENV
        
        # 复制并重命名
        Copy-Item "build_${{ matrix.platform }}_${{ matrix.target.name }}\Release\WebDavClient.exe" "release_package\$fileName"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WebDAVClient_${{ matrix.platform }}_${{ matrix.target.name }}_${{ env.FILENAME }}
        path: release_package/${{ env.FILENAME }}

    - name: Publish Release to GitHub
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release_package/${{ env.FILENAME }}
        generate_release_notes: true