name: Build WebDAV Client

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    strategy:
      matrix:
        platform: [WIN7, WIN10]
        target:
          - { arch: "Win32", name: "x86" }
          - { arch: "x64",   name: "x64" }

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Configure CMake
      run: cmake -B build_${{ matrix.platform }}_${{ matrix.target.name }} -S . -A ${{ matrix.target.arch }} -DTARGET_PLATFORM=${{ matrix.platform }}

    - name: Build
      run: cmake --build build_${{ matrix.platform }}_${{ matrix.target.name }} --config Release

    - name: Prepare Artifacts and Version
      shell: pwsh
      run: |
        mkdir release_package
        
        $version = "dev"
        if ("${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref_name }}"
        }
        
        $fileName = "WebDavClient_${{ matrix.platform }}_${{ matrix.target.name }}_${version}.exe"
        
        echo "FILENAME=$fileName" >> $env:GITHUB_ENV
        echo "VERSION=$version" >> $env:GITHUB_ENV
        
        Copy-Item "build_${{ matrix.platform }}_${{ matrix.target.name }}\Release\WebDavClient.exe" "release_package\$fileName"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: WebDAVClient_${{ matrix.platform }}_${{ matrix.target.name }}
        path: release_package/${{ env.FILENAME }}

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: release_package
        merge-multiple: true

    - name: Get version
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        echo "VERSION=$version" >> $env:GITHUB_ENV

    - name: Publish Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        name: WebDAVClient_${{ env.VERSION }}
        files: release_package/*.exe
        generate_release_notes: true