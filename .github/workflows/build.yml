name: Build WebDAV Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  detect-version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
    - uses: actions/checkout@v7
    - name: Extract version from commit message
      id: version
      shell: pwsh
      run: |
        $commitMsg = git log -1 --pretty=%B
        echo "Commit message: $commitMsg"
        if ($commitMsg -match '\bv(\d+(?:\.\d+)*)') {
          $version = "v$($Matches[1])"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "is_release=true" >> $env:GITHUB_OUTPUT
          echo "Detected release version: $version"
        } else {
          echo "is_release=false" >> $env:GITHUB_OUTPUT
          echo "No version pattern found in commit message, build only"
        }

  build:
    needs: detect-version
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [WIN7, WIN10]
        target:
          - { arch: "Win32", name: "x86" }
          - { arch: "x64",   name: "x64" }

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Configure CMake
      run: cmake -B build_${{ matrix.platform }}_${{ matrix.target.name }} -S . -A ${{ matrix.target.arch }} -DTARGET_PLATFORM=${{ matrix.platform }}

    - name: Build
      run: cmake --build build_${{ matrix.platform }}_${{ matrix.target.name }} --config Release

    - name: Prepare Artifacts
      shell: pwsh
      run: |
        mkdir release_package
        $version = "dev"
        if ("${{ needs.detect-version.outputs.is_release }}" -eq "true") {
          $version = "${{ needs.detect-version.outputs.version }}"
        }
        $fileName = "WebDavClient_${{ matrix.platform }}_${{ matrix.target.name }}_${version}.exe"
        echo "FILENAME=$fileName" >> $env:GITHUB_ENV
        Copy-Item "build_${{ matrix.platform }}_${{ matrix.target.name }}\Release\WebDavClient.exe" "release_package\$fileName"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: WebDAVClient_${{ matrix.platform }}_${{ matrix.target.name }}
        path: release_package/${{ env.FILENAME }}

  release:
    needs: [detect-version, build]
    runs-on: windows-latest
    if: needs.detect-version.outputs.is_release == 'true'
    permissions:
      contents: write

    steps:
    - name: Release info
      shell: pwsh
      run: |
        echo "Creating release: WebDAVClient_${{ needs.detect-version.outputs.version }}"
        echo "Target commit: ${{ github.sha }}"

    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts

    - name: Collect release files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release_files
        Get-ChildItem -Path artifacts -Recurse -Filter *.exe | Copy-Item -Destination release_files
        echo "Files to release:"
        Get-ChildItem -Path release_files -Filter *.exe | ForEach-Object { echo "  $($_.Name)" }

    - name: Publish Release to GitHub
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.detect-version.outputs.version }}
        name: WebDAVClient_${{ needs.detect-version.outputs.version }}
        target_commitish: ${{ github.sha }}
        files: release_files/*.exe
        generate_release_notes: true