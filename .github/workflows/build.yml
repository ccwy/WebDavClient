name: Build WebDAV Client

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [WIN7, WIN10]
        target:
          - { arch: "Win32", name: "x86" }
          - { arch: "x64",   name: "x64" }

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Configure CMake
      run: cmake -B build_${{ matrix.platform }}_${{ matrix.target.name }} -S . -A ${{ matrix.target.arch }} -DTARGET_PLATFORM=${{ matrix.platform }}

    - name: Build
      run: cmake --build build_${{ matrix.platform }}_${{ matrix.target.name }} --config Release

    - name: Prepare Artifacts
      shell: pwsh
      run: |
        mkdir release_package
        $version = "dev"
        if ("${{ github.ref }}" -like "refs/tags/*") {
            $version = "${{ github.ref_name }}"
        }
        $fileName = "WebDavClient_${{ matrix.platform }}_${{ matrix.target.name }}_${version}.exe"
        echo "FILENAME=$fileName" >> $env:GITHUB_ENV
        Copy-Item "build_${{ matrix.platform }}_${{ matrix.target.name }}\Release\WebDavClient.exe" "release_package\$fileName"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: WebDAVClient_${{ matrix.platform }}_${{ matrix.target.name }}
        path: release_package/${{ env.FILENAME }}

  release:
    needs: build
    runs-on: windows-latest
    if: always()
    permissions:
      contents: write

    steps:
    - name: Debug GitHub context
      if: always()
      shell: pwsh
      run: |
        echo "=== GitHub Context ==="
        echo "github.ref_type   = ${{ github.ref_type }}"
        echo "github.ref        = ${{ github.ref }}"
        echo "github.ref_name   = ${{ github.ref_name }}"
        echo "github.event_name = ${{ github.event_name }}"
        echo "github.sha        = ${{ github.sha }}"
        echo "======================"
        if ("${{ github.ref_type }}" -ne "tag") {
          echo "SKIP REASON: github.ref_type is '${{ github.ref_type }}', not 'tag'"
          echo "Release will only be published when a tag (v*) is pushed."
        }

    - name: Download all artifacts
      if: github.ref_type == 'tag'
      uses: actions/download-artifact@v7
      with:
        path: artifacts

    - name: Collect release files
      if: github.ref_type == 'tag'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release_files
        Get-ChildItem -Path artifacts -Recurse -Filter *.exe | Copy-Item -Destination release_files
        echo "Files to release:"
        Get-ChildItem -Path release_files -Filter *.exe | ForEach-Object { echo "  $($_.Name)" }

    - name: Publish Release to GitHub
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        name: WebDAVClient_${{ github.ref_name }}
        files: release_files/*.exe
        generate_release_notes: true