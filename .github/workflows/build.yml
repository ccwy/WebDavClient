name: Build WebDAV Client

on:
  push:
    branches: [ "main", "SMBA" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" , "SMBA"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [WIN7, WIN10]
        target:
          - { arch: "Win32", name: "x86" }
          - { arch: "x64",   name: "x64" }

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: 提取版本号
      id: version
      shell: bash
      run: |
        TAG_NAME=""
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
        else
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          TAG_NAME=$(echo "$COMMIT_MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
        fi
        if [ -n "$TAG_NAME" ]; then
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "✅ 检测到版本号: $TAG_NAME"
        else
          echo "ℹ️ 未检测到版本号，仅构建"
        fi

    - name: Configure CMake
      run: cmake -B build_${{ matrix.platform }}_${{ matrix.target.name }} -S . -A ${{ matrix.target.arch }} -DTARGET_PLATFORM=${{ matrix.platform }}

    - name: Build
      run: cmake --build build_${{ matrix.platform }}_${{ matrix.target.name }} --config Release

    - name: Prepare Artifacts
      shell: pwsh
      run: |
        mkdir release_package
        $tag = "${{ steps.version.outputs.tag }}"
        $version = if ($tag -ne "") { $tag } else { "dev" }
        $fileName = "WebDavClient_${{ matrix.platform }}_${{ matrix.target.name }}_${version}.exe"
        echo "FILENAME=$fileName" >> $env:GITHUB_ENV
        Copy-Item "build_${{ matrix.platform }}_${{ matrix.target.name }}\Release\WebDavClient.exe" "release_package\$fileName"
        # 生成发布描述文件
        if ($tag -ne "") {
          $commitMsg = "${{ github.event.head_commit.message }}"
          $lines = $commitMsg -split "`n"
          $body = if ($lines.Count -gt 1) { ($lines[1..($lines.Count-1)] | Where-Object { $_.Trim() -ne '' }) -join "`n" } else { $commitMsg }
          if ([string]::IsNullOrWhiteSpace($body)) { $body = $commitMsg }
          $body | Out-File -FilePath "release_package\release_body.txt" -Encoding utf8
        }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: WebDAVClient_${{ matrix.platform }}_${{ matrix.target.name }}
        path: release_package/${{ env.FILENAME }}

    - name: 发布到 Release
      if: steps.version.outputs.tag != ''
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: WebDAVClient_${{ steps.version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        body_path: release_package/release_body.txt
        files: release_package/${{ env.FILENAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}